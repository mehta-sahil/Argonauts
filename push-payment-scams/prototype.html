<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Push-Payment Scam Detection</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" onerror="void 0"></script>
<script src="demo_data.js" onerror="void 0"></script>
<style>
  :root{
    --bg:#0b0f17;--panel:#121826;--panel2:#1a2130;--line:#262f42;--text:#e6ebf4;
    --muted:#8a97ac;--accent:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);
       font-size:14px;line-height:1.45;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
         align-items:baseline;gap:16px;flex-wrap:wrap;}
  header h1{font-size:16px;font-weight:650;}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .main{flex:1;display:flex;min-height:0;}
  .center{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 18px;gap:12px;overflow:hidden;}
  .side{width:330px;border-left:1px solid var(--line);background:var(--panel);padding:16px;
        overflow-y:auto;display:flex;flex-direction:column;gap:18px;}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  select,button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
        border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;}
  button{cursor:pointer;font-weight:600;}
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#05222a;}
  .gauge-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;}
  .gauge-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
        display:flex;justify-content:space-between;}
  .gauge-track{height:10px;border-radius:5px;background:var(--line);margin-top:6px;position:relative;overflow:hidden;}
  .gauge-fill{height:100%;width:0;background:var(--green);transition:width .3s,background .3s;}
  .gauge-thresh{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.5;}
  .chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding:6px 2px;}
  .msg{max-width:74%;padding:9px 12px;border-radius:12px;font-size:13px;position:relative;}
  .msg.them{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);}
  .msg.me{align-self:flex-end;background:#14314a;border:1px solid #1d4a6e;}
  .msg .who{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
  .msg .chips{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap;}
  .chip{font-size:9px;background:rgba(248,113,113,.16);color:var(--red);padding:1px 6px;border-radius:4px;
        text-transform:uppercase;letter-spacing:.3px;}
  .msg .sc{position:absolute;right:8px;top:8px;font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;}
  .guard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);}
  .guard h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px;}
  .guard .verdict{font-size:15px;font-weight:700;padding:4px 10px;border-radius:6px;display:inline-block;}
  .verdict.allow{background:rgba(52,211,153,.16);color:var(--green);}
  .verdict.warn{background:rgba(251,191,36,.16);color:var(--amber);}
  .verdict.hold,.verdict.block{background:rgba(248,113,113,.18);color:var(--red);}
  .pf{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;color:var(--muted);margin-top:8px;
      font-family:ui-monospace,monospace;}
  .pf b{color:var(--text);}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;}
  .metric{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(38,47,66,.5);font-size:13px;}
  .metric:last-child{border-bottom:none;}
  .metric .v{font-weight:700;font-family:ui-monospace,monospace;}
  .metric .v.good{color:var(--green);}
  .narr{font-size:12px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);padding-top:12px;}
  .empty{padding:40px;color:var(--muted);text-align:center;}
  code{background:var(--panel2);padding:1px 4px;border-radius:4px;font-family:ui-monospace,monospace;}
  .axis text{fill:var(--muted);font-size:10px;}
  .axis path,.axis line{stroke:var(--line);}
</style>
</head>
<body>
<header>
  <div>
    <h1>Push-Payment Scam Detection</h1>
    <div class="sub">LLM scammer vs a scam-intent text model + a payment-risk guard. Play a conversation and watch both layers decide.</div>
  </div>
</header>

<div class="main">
  <div class="center" id="center">
    <div class="controls">
      <select id="pick"></select>
      <button class="primary" id="play">Play</button>
      <button id="step">Step</button>
      <button id="reset">Reset</button>
    </div>
    <div class="gauge-wrap">
      <div class="gauge-label"><span>conversation scam score</span><span id="gval">0.00</span></div>
      <div class="gauge-track"><div class="gauge-fill" id="gfill"></div><div class="gauge-thresh" id="gthr"></div></div>
    </div>
    <div class="chat" id="chat"><div class="empty" id="noData">Run <code>python run.py</code> then reload.</div></div>
    <div id="guardSlot"></div>
  </div>
  <div class="side" id="side"></div>
</div>

<script>
const DEMO = window.DEMO;
if (DEMO) build();

function build(){
  document.getElementById("noData")?.remove();
  const pick = document.getElementById("pick");
  DEMO.conversations.forEach((c,i)=>{
    const o=document.createElement("option");
    o.value=i;
    o.textContent=`${c.label==="scam"?"🔴":"🟢"}  ${c.archetype.replace(/_/g," ")}`;
    pick.appendChild(o);
  });
  sidebar();
  let cur=0, shown=0, timer=null;
  const chat=document.getElementById("chat");
  const gfill=document.getElementById("gfill"), gval=document.getElementById("gval");
  document.getElementById("gthr").style.left=(DEMO.flag_threshold*100)+"%";

  function reset(){
    clearInterval(timer);timer=null;shown=0;chat.innerHTML="";
    document.getElementById("guardSlot").innerHTML="";
    gfill.style.width="0";gfill.style.background="var(--green)";gval.textContent="0.00";
  }
  function stepOne(){
    const c=DEMO.conversations[cur];
    if(shown>=c.turns.length){clearInterval(timer);timer=null;showGuard(c);return;}
    const t=c.turns[shown++];
    const d=document.createElement("div");
    d.className="msg "+t.speaker;
    let chips="";
    if(t.fired&&t.fired.length) chips=`<div class="chips">${t.fired.map(f=>`<span class="chip">${f.replace("lex_","")}</span>`).join("")}</div>`;
    const sc=t.score!=null?`<span class="sc">${t.score.toFixed(2)}</span>`:"";
    d.innerHTML=`<div class="who">${t.speaker==="them"?"caller / sender":"customer"}</div>${sc}${escapeHtml(t.text)}${chips}`;
    if(t.score!=null){
      const r=Math.min(t.score,1);
      d.style.borderColor=`rgba(248,113,113,${0.25+0.6*r})`;
      d.style.background=`rgba(248,113,113,${0.05+0.16*r})`;
    }
    chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
    const run=t.running??0;
    gfill.style.width=(run*100)+"%";
    gfill.style.background=run>=DEMO.flag_threshold?"var(--red)":run>=DEMO.flag_threshold*0.6?"var(--amber)":"var(--green)";
    gval.textContent=run.toFixed(2);
    if(shown>=c.turns.length){clearInterval(timer);timer=null;showGuard(c);}
  }
  function showGuard(c){
    if(!c.payment){document.getElementById("guardSlot").innerHTML=
      `<div class="guard"><h3>Payment guard</h3><div class="verdict allow">no payment in this conversation</div></div>`;return;}
    const pf=c.payment_features||{};
    const rows=Object.entries(pf).map(([k,v])=>`<span>${k.replace(/_/g," ")}</span><b>${v}</b>`).join("");
    document.getElementById("guardSlot").innerHTML=`
      <div class="guard">
        <h3>Payment guard — customer is about to send $${(c.payment.amount||0).toLocaleString()}</h3>
        <div class="verdict ${c.decision}">${c.decision.toUpperCase()}${c.decision==="block"?" — transfer stopped":""}</div>
        <span style="margin-left:10px;font-family:ui-monospace,monospace;color:var(--muted)">fused risk ${c.payment_risk}</span>
        <div class="pf">${rows}</div>
      </div>`;
  }
  document.getElementById("play").onclick=()=>{
    if(timer){clearInterval(timer);timer=null;return;}
    if(shown>=DEMO.conversations[cur].turns.length) reset();
    timer=setInterval(stepOne,900);
  };
  function renderAll(){
    reset();
    const c=DEMO.conversations[cur];
    while(shown<c.turns.length) stepOne();
  }
  document.getElementById("step").onclick=stepOne;
  document.getElementById("reset").onclick=reset;
  pick.onchange=()=>{cur=+pick.value;renderAll();};
  renderAll();
}

function escapeHtml(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function sidebar(){
  const m=DEMO.metrics, f=m.fusion, side=document.getElementById("side");
  side.innerHTML=`
    <div>
      <h2>Layer 1 — scam-intent text model (held-out)</h2>
      <div class="metric"><span>message AUC-PR</span><span class="v">${m.msg_ap}</span></div>
      <div class="metric"><span>conversation AUC-PR</span><span class="v">${m.conv_ap}</span></div>
      <div class="metric"><span>flagged before the payment ask</span><span class="v good">${m.flagged_before_ask}/${m.convos_with_ask}</span></div>
      <div class="metric"><span>mean lead time</span><span class="v">${m.mean_lead_turns} turns</span></div>
    </div>
    <div>
      <h2>Layer 2 — payment-risk fusion (held-out payments)</h2>
      <div class="metric"><span>scam payments stopped</span><span class="v good">${f.scam_stopped}/${m.n_scam_pay} (${Math.round(f.stop_rate*100)}%)</span></div>
      <div class="metric"><span>genuine-payment friction</span><span class="v">${Math.round(f.friction_rate*100)}%</span></div>
      <div class="metric"><span>hard false-block</span><span class="v">${Math.round(f.hard_fp_rate*100)}%</span></div>
      <div class="metric"><span>~ scam $ prevented (test slice)</span><span class="v good">$${Math.round(m.prevented_usd).toLocaleString()}</span></div>
    </div>
    <div>
      <h2>Arms race — scammer paraphrases to evade</h2>
      <svg id="chart" width="298" height="150"></svg>
      <div style="font-size:11px;color:var(--muted)">As the scammer rewrites messages (greedy word attack, TextFooler-style), the <b style="color:var(--amber)">text-only</b> detector falls; the <b style="color:var(--green)">fusion</b> layer holds — a first-time payee can't be reworded.</div>
    </div>
    <div class="narr">${DEMO.narrative}</div>`;
  drawChart(m.evade_curve);
}

function drawChart(curve){
  if(!window.d3) return;
  const w=298,h=150,mL=32,mB=24,mT=8,mR=8;
  const svg=d3.select("#chart");
  const x=d3.scaleLinear().domain([0,1]).range([mL,w-mR]);
  const y=d3.scaleLinear().domain([0,1]).range([h-mB,mT]);
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${h-mB})`)
     .call(d3.axisBottom(x).ticks(0).tickSize(0));
  svg.append("g").attr("class","axis").attr("transform",`translate(${mL},0)`)
     .call(d3.axisLeft(y).ticks(3).tickFormat(d3.format(".0%")));
  const line=k=>d3.line().x(d=>x(d.strength)).y(d=>y(d[k]));
  svg.append("path").datum(curve).attr("fill","none").attr("stroke","var(--amber)").attr("stroke-width",2).attr("d",line("text_only_recall"));
  svg.append("path").datum(curve).attr("fill","none").attr("stroke","var(--green)").attr("stroke-width",2).attr("d",line("fusion_recall"));
  curve.forEach(d=>{
    svg.append("circle").attr("cx",x(d.strength)).attr("cy",y(d.text_only_recall)).attr("r",2.5).attr("fill","var(--amber)");
    svg.append("circle").attr("cx",x(d.strength)).attr("cy",y(d.fusion_recall)).attr("r",2.5).attr("fill","var(--green)");
  });
  svg.append("text").attr("x",mL).attr("y",h-6).attr("class","axis").text("no change");
  svg.append("text").attr("x",w-mR).attr("y",h-6).attr("class","axis").attr("text-anchor","end").text("heavy paraphrase");
}
</script>
</body>
</html>
