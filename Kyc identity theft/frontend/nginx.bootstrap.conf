# Boot config: static files only, no proxies.
#
# nginx resolves a literal proxy_pass hostname while loading its config and
# refuses to start if the lookup fails. Lightsail starts every container in
# parallel, so the backends often have no address yet when nginx boots - that
# killed the frontend, failed the public health check, and took down whole
# deployments.
#
# Serving static content needs no upstreams at all, so nginx starts with this
# immediately and the health check passes in under a second. 40-upstream-wait
# then waits for the backends to appear and swaps in the full config.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /labs/ {
        try_files $uri $uri/ =404;
    }

    # Answer honestly while the backends are still coming up, rather than
    # hanging or returning a confusing nginx error page.
    location ~ ^/(api|ws|pp-api|cb-api|va-api)/ {
        default_type application/json;
        return 503 '{"error":"backend still starting, retry in a moment"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
