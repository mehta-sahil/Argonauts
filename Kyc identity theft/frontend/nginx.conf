# Containers in a Lightsail container service share one network namespace, so
# they reach each other on 127.0.0.1 and NOT by container name. That is also
# why Lightsail rejects two containers claiming the same port - there is only
# one port space between them.
#
# Using a literal IP has a second benefit: nginx needs no DNS lookup at config
# load, so it starts whether or not a backend is up yet. A backend that is
# still booting costs one 502, not the whole deployment.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static lab files (self-contained HTML prototypes)
    location /labs/ {
        try_files $uri $uri/ =404;
    }

    # KYC WebSocket / API proxy — forwarded to the backend container
    location /ws/ {
        proxy_pass         http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8003;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Push-payment scams API proxy
    location /pp-api/ {
        rewrite            ^/pp-api/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
    }

    # Chatbot API proxy
    location /cb-api/ {
        rewrite            ^/cb-api/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host $host;
    }

    # Voice-auth live clone proxy
    location /va-api/ {
        rewrite            ^/va-api/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:8002;
        proxy_set_header   Host $host;
        # Cloning uploads audio and the dubbing job takes a while to return.
        client_max_body_size 20m;
        proxy_read_timeout   300s;
    }

    # SPA fallback — everything else goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
