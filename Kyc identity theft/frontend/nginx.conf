server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static lab files (self-contained HTML prototypes)
    location /labs/ {
        try_files $uri $uri/ =404;
    }

    # KYC WebSocket / API proxy — forwarded to the backend container
    location /ws/ {
        proxy_pass         http://kyc-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass         http://kyc-backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Push-payment scams API proxy
    location /pp-api/ {
        rewrite            ^/pp-api/(.*)$ /$1 break;
        proxy_pass         http://pushpay:8000;
        proxy_set_header   Host $host;
    }

    # Chatbot API proxy
    location /cb-api/ {
        rewrite            ^/cb-api/(.*)$ /$1 break;
        proxy_pass         http://chatbot:8001;
        proxy_set_header   Host $host;
    }

    # SPA fallback — everything else goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
