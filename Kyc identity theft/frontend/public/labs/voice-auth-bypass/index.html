<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice-Auth Bypass Arena</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" onerror="void 0"></script>
<script src="demo_data.js" onerror="void 0"></script>
<style>
  :root{--bg:#0b0f17;--panel:#121826;--panel2:#1a2130;--line:#262f42;--text:#e6ebf4;
        --muted:#8a97ac;--accent:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;--violet:#a78bfa;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Inter","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);
       font-size:14px;line-height:1.45;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
         align-items:baseline;gap:16px;flex-wrap:wrap;}
  header h1{font-size:16px;font-weight:650;}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .main{flex:1;display:flex;min-height:0;}
  .center{flex:1;display:flex;flex-direction:column;min-width:0;padding:14px 18px;gap:12px;overflow-y:auto;}
  .side{width:330px;border-left:1px solid var(--line);background:var(--panel);padding:16px;
        overflow-y:auto;display:flex;flex-direction:column;gap:18px;}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  select,button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
        border-radius:8px;padding:6px 11px;font-size:12px;font-family:inherit;}
  button{cursor:pointer;font-weight:600;} button:hover{border-color:var(--accent);}
  .cfgtabs button.on{background:var(--accent);border-color:var(--accent);color:#05222a;}
  input[type=range]{accent-color:var(--accent);}
  .callcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;}
  .callcard .cid{padding:9px 13px;background:var(--panel2);border-bottom:1px solid var(--line);
        display:flex;justify-content:space-between;align-items:center;font-size:13px;}
  .badge{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
  .badge.spoof{background:rgba(248,113,113,.18);color:var(--red);}
  .badge.match{background:rgba(52,211,153,.16);color:var(--green);}
  .transcript{padding:12px 14px;font-size:13px;line-height:1.6;}
  .mk{background:rgba(251,191,36,.18);border-radius:3px;padding:0 2px;}
  .pipeline{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap;}
  .stage{flex:1;min-width:140px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel2);}
  .stage .n{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  .stage .v{font-size:13px;font-weight:700;margin-top:3px;}
  .stage.pass{border-color:rgba(52,211,153,.4);} .stage.fail{border-color:rgba(248,113,113,.5);}
  .stage .cap{font-size:10px;color:var(--muted);margin-top:3px;}
  .bio{padding:10px 14px;border-top:1px solid var(--line);}
  .biorow{display:flex;align-items:center;gap:8px;font-size:11px;font-family:ui-monospace,monospace;margin:2px 0;}
  .biorow .name{width:150px;color:var(--muted);}
  .biotrack{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#1a2130,#2a3348,#1a2130);position:relative;}
  .biotrack .band{position:absolute;top:0;bottom:0;background:rgba(52,211,153,.18);}
  .biotrack .dot{position:absolute;top:-2px;width:12px;height:12px;border-radius:50%;background:var(--green);transform:translateX(-50%);}
  .biotrack .dot.flag{background:var(--red);box-shadow:0 0 6px var(--red);}
  .outcome{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;}
  .verdict{font-size:15px;font-weight:800;padding:4px 12px;border-radius:7px;}
  .verdict.blocked{background:rgba(52,211,153,.16);color:var(--green);}
  .verdict.fraud{background:rgba(248,113,113,.2);color:var(--red);}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px;}
  .frow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(38,47,66,.5);}
  .frow .v{font-family:ui-monospace,monospace;font-weight:700;}
  .frow .v.bad{color:var(--red);} .frow .v.good{color:var(--green);}
  .bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin:3px 0 8px;}
  .bar>i{display:block;height:100%;background:var(--red);}
  .narr{font-size:12px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line);padding-top:12px;}
  .axis text{fill:var(--muted);font-size:10px;} .axis path,.axis line{stroke:var(--line);}
  .empty{padding:40px;color:var(--muted);text-align:center;}
  code{background:var(--panel2);padding:1px 4px;border-radius:4px;font-family:ui-monospace,monospace;}
</style>

<!-- ARGONAUTS SHARED DESIGN SYSTEM -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Override lab colours to match Hub design system */
  :root {
    --bg:     #0A0B0D !important;
    --panel:  #15171B !important;
    --panel2: #1C1F24 !important;
    --line:   #2A2D33 !important;
    --text:   #F5F6F7 !important;
    --muted:  #9A9EA6 !important;
    --accent: #38BDF8 !important;
    --red:    #E5484D !important;
    --green:  #22D3EE !important;
  }

  /* Argonauts sticky navbar */
  #argos-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 24px;
    height: 56px;
    background: rgba(10,11,13,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid #2A2D33;
    font-family: 'Inter', system-ui, sans-serif;
  }
  #argos-nav .argos-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }
  #argos-nav .argos-wordmark {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #F5F6F7;
  }
  #argos-nav .argos-sep {
    width: 1px;
    height: 18px;
    background: #2A2D33;
  }
  #argos-nav .argos-lab-name {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #38BDF8;
  }
  #argos-nav .argos-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: #38BDF8;
    opacity: 0.7;
  }
  #argos-nav .argos-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: #9A9EA6;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid #2A2D33;
    transition: color 0.15s, border-color 0.15s;
  }
  #argos-nav .argos-back:hover {
    color: #F5F6F7;
    border-color: #9A9EA6;
  }

  /* nudge existing wrap to not double-pad */
  .wrap { padding-top: 16px !important; }
  body { font-family: 'Inter', system-ui, sans-serif !important; }
</style>
<!-- END ARGONAUTS SHARED DESIGN SYSTEM -->
</head>
<body>
<nav id="argos-nav">
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="/" class="argos-brand">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
        <path d="M16 2 L28 8 L28 22 Q28 29 16 30 Q4 29 4 22 L4 8 Z" fill="#0A0B0D" stroke="#E5484D" stroke-width="1.5"/>
        <path d="M16 8 L22 11 L22 20 Q22 24 16 26 Q10 24 10 20 L10 11 Z" fill="#071419" stroke="#22D3EE" stroke-width="1"/>
        <circle cx="16" cy="16" r="2.5" fill="#22D3EE"/>
      </svg>
      <span class="argos-wordmark">Argonauts</span>
    </a>
    <span class="argos-sep"></span>
    <span class="argos-num">06</span>
    <span class="argos-lab-name">Voice-Auth Bypass</span>
  </div>
  <a href="/" class="argos-back">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 4l-5 4 5 4"/>
    </svg>
    All Labs
  </a>
</nav>
<header>
  <div>
    <h1>Voice-Auth Bypass Arena</h1>
    <div class="sub">A cloned voice phones in a payment authorization. Voiceprint passes it. Only the callback protocol stops a good clone.</div>
  </div>
</header>
<div class="main">
  <div class="center" id="center">
    <div class="controls">
      <select id="scenario"><option value="ceo_wire">CEO-fraud wire</option><option value="family_bail">Family "bail" scam</option></select>
      <span class="cfgtabs" id="cfgtabs"></span>
      <span style="color:var(--muted);font-size:11px">clone quality:</span>
      <input type="range" id="quality" min="0" max="2" step="1" value="1">
      <span id="qlabel" style="font-size:11px;color:var(--muted)">mid</span>
    </div>
    <div id="slot"><div class="empty" id="noData">Run <code>python run.py</code> then reload.</div></div>
  </div>
  <div class="side" id="side"></div>
</div>
<script>
const DEMO = window.DEMO;

const BIO_BANDS = {
  jitter_pct:[0.2,2.0,0,4], shimmer_db:[0.22,0.62,0,1], hnr_db:[12,22,8,30],
  f0_range_semitones:[6,14,0,16], f0_contour_smoothness:[0.3,0.75,0,1],
  spectral_flatness:[0.08,0.28,0,0.5], spectral_tilt_db_oct:[-13,-7,-16,-4],
  phase_artifact:[0,0.25,0,0.7], hf_energy_ratio:[0.09,0.27,0,0.35],
  checkerboard_score:[0,0.09,0,0.4], breath_rate_pm:[6,20,0,24],
  pause_regularity_cv:[0.5,1.3,0,1.6], reverb_rt60_s:[0.12,0.52,0,0.6],
  bg_snr_db:[13,32,5,50], latency_glitch_count:[0,2,0,10], codec_mismatch:[0,0.2,0,1],
};
const QBUCKET = ["low","mid","high"];

if (DEMO) build();

function build(){
  document.getElementById("noData")?.remove();
  const tabs=document.getElementById("cfgtabs");
  ["none","voiceprint","antispoof","context","full"].forEach(c=>{
    const b=document.createElement("button");b.textContent=c;b.onclick=()=>{cfg=c;paint();render();};tabs.appendChild(b);
  });
  let cfg="full";
  const sc=document.getElementById("scenario"), q=document.getElementById("quality"), ql=document.getElementById("qlabel");
  function paint(){[...tabs.children].forEach(b=>b.classList.toggle("on",b.textContent===cfg));}
  function ep(){
    const bucket=QBUCKET[+q.value]; ql.textContent=bucket;
    return DEMO.episodes.find(e=>e.defense===cfg&&e.scenario===sc.value
      && (e.quality<0.45?"low":e.quality<0.75?"mid":"high")===bucket)
      || DEMO.episodes.find(e=>e.defense===cfg&&e.scenario===sc.value);
  }
  function render(){
    const e=ep(); const slot=document.getElementById("slot");
    if(!e){slot.innerHTML="<div class='empty'>no episode</div>";return;}
    const t=e.turns[e.turns.length-1], c=t.call, L=t.screen.layers;
    const money=t.screen.passed;
    slot.innerHTML=`
      <div class="callcard">
        <div class="cid"><span>Inbound call — claims to be <b>${c.meta.claimed_identity}</b></span>
          <span class="badge ${c.meta.caller_id_match?'match':'spoof'}">caller ID ${c.meta.caller_id_match?'matches enrolled':'spoofed'}</span></div>
        <div class="transcript">${highlight(c.transcript)}</div>
        <div class="pipeline">
          ${stage("voiceprint","match "+ (L.voiceprint.score).toFixed(2), L.voiceprint.accepts, "sounds like them — which is exactly why this isn't enough")}
          ${stage("anti-spoof (liveness)", "spoof prob "+(L.antispoof.spoof_prob).toFixed(2), !L.antispoof.is_spoof,
                  L.antispoof.flagged.length? "tells: "+L.antispoof.flagged.slice(0,3).join(", ") : "no acoustic tells")}
          ${stage("call context", "risk "+(L.context.risk).toFixed(2), !L.context.high,
                  "amount / new payee / urgency / secrecy")}
          ${L.protocol? stage("auth protocol", L.protocol.step.replace(/_/g,' '), L.protocol.money_moves, L.protocol.detail)
                      : stage("auth protocol","not enforced",false,"this config has no out-of-band step")}
        </div>
        <div class="bio">${Object.keys(BIO_BANDS).map(f=>bioRow(f,c.biomarkers[f],c.flagged.includes(f))).join("")}</div>
        <div class="outcome">
          <span class="verdict ${money?'fraud':'blocked'}">${money?'PAYMENT SENT — FRAUD SUCCEEDS':'BLOCKED'}</span>
          <span style="font-size:12px;color:var(--muted)">${t.screen.detail}</span>
        </div>
      </div>
      <div style="font-size:12px;color:var(--muted)">clone quality ${e.final_quality} · evasions applied: ${e.final_evasions.join(", ")||"none"} · ${e.rounds} attempt(s)</div>`;
  }
  sc.onchange=render; q.oninput=render;
  paint(); render(); sidebar();
}

function stage(name,val,ok,cap){
  return `<div class="stage ${ok?'pass':'fail'}"><div class="n">${name}</div>
    <div class="v" style="color:${ok?'var(--green)':'var(--red)'}">${ok?'PASS':'FAIL'} <span style="color:var(--muted);font-weight:400">${val}</span></div>
    <div class="cap">${cap}</div></div>`;
}
function bioRow(f,v,flag){
  const [lo,hi,mn,mx]=BIO_BANDS[f];
  const pos=x=>Math.max(0,Math.min(100,(x-mn)/(mx-mn)*100));
  return `<div class="biorow"><span class="name">${f}</span>
    <span class="biotrack"><span class="band" style="left:${pos(lo)}%;width:${pos(hi)-pos(lo)}%"></span>
    <span class="dot ${flag?'flag':''}" style="left:${pos(v)}%"></span></span>
    <span style="width:52px;text-align:right">${(+v).toFixed(2)}</span></div>`;
}
function highlight(txt){
  return txt.replace(/(right now|today|immediately|urgent|no time|can't wait|before the market)/gi,'<span class="mk">$1</span>')
            .replace(/(don't tell|keep this off|between us|confidential|don't call me back|whatsapp|personal number)/gi,'<span class="mk">$1</span>');
}

function sidebar(){
  const S=DEMO.summary, side=document.getElementById("side");
  const rows=["none","voiceprint","antispoof","context","full"].map(c=>{
    const r=S[c].fraud_rate;
    return `<div class="frow"><span>${c}</span><span class="v ${r>0.2?'bad':'good'}">${Math.round(r*100)}% fraud</span></div>
      <div class="bar"><i style="width:${r*100}%"></i></div>`;
  }).join("");
  side.innerHTML=`
    <div><h2>Fraud success rate — by defence</h2>${rows}
      <div style="font-size:11px;color:var(--muted)">genuine calls wrongly blocked under <b>full</b>: ${S.full.friction.blocked}/${S.full.friction.n}</div></div>
    <div><h2>Anti-spoof detection vs clone quality</h2><svg id="curve" width="298" height="130"></svg>
      <div style="font-size:11px;color:var(--muted)">held-out EER <b>${DEMO.antispoof_eer}</b>. A top-tier clone drops detection to near zero — the liveness check loses the arms race.</div></div>
    <div class="narr">${DEMO.narrative}</div>`;
  drawCurve(DEMO.detection_curve);
}
function drawCurve(cur){
  if(!window.d3||!cur.length)return;
  const w=298,h=130,m={l:34,b:22,t:8,r:8};
  const svg=d3.select("#curve");
  const x=d3.scaleLinear().domain([0.2,1]).range([m.l,w-m.r]);
  const y=d3.scaleLinear().domain([0,1]).range([h-m.b,m.t]);
  svg.append("g").attr("class","axis").attr("transform",`translate(0,${h-m.b})`).call(d3.axisBottom(x).ticks(3).tickFormat(d3.format(".0%")));
  svg.append("g").attr("class","axis").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(3).tickFormat(d3.format(".0%")));
  svg.append("path").datum(cur).attr("fill","none").attr("stroke","var(--amber)").attr("stroke-width",2)
     .attr("d",d3.line().x(d=>x(d.quality)).y(d=>y(d.detected)));
  cur.forEach(d=>svg.append("circle").attr("cx",x(d.quality)).attr("cy",y(d.detected)).attr("r",2.5).attr("fill","var(--amber)"));
  svg.append("text").attr("x",w-m.r).attr("y",m.t+8).attr("text-anchor","end").attr("class","axis").text("→ better clone");
}
</script>
</body>
</html>
