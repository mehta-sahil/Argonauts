<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 10 L85 28 L85 72 L50 90 L15 72 L15 28 Z' fill='%23E5484D' fill-opacity='0.15' stroke='%23E5484D' stroke-width='3'/><path d='M50 22 L73 34 L73 66 L50 78 L27 66 L27 34 Z' fill='%2322D3EE' fill-opacity='0.2' stroke='%2322D3EE' stroke-width='2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argonauts — Open-Source Fraud Research Labs</title>
    <meta name="description" content="Argonauts is an open-source collection of red-team / blue-team fraud simulation labs. Each lab pairs a synthetic, sandboxed payment-fraud attack with the detection system that stops it." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-argos-bg text-argos-text font-inter antialiased overflow-x-hidden selection:bg-attack/30 selection:text-attack">
    <div id="root">
      <!-- Initial Skeleton Loader (Zero-latency layout before bundle executes) -->
      <div id="app-skeleton" style="min-height:100vh;background:#0A0B0D;color:#F5F6F7;font-family:system-ui,sans-serif;padding:0;margin:0;overflow:hidden;position:relative;">
        <style>
          @keyframes sk-shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
          .sk-box {
            background: #15171B;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
          }
          .sk-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: sk-shimmer 1.8s infinite;
          }
          @media (max-width: 900px) {
            .sk-hero-grid { grid-template-columns: 1fr !important; }
            .sk-cards-grid { grid-template-columns: 1fr !important; }
          }
        </style>
        
        <!-- Skeleton Navbar -->
        <div style="height:64px;border-bottom:1px solid #2A2D33;display:flex;align-items:center;justify-content:space-between;padding:0 24px;max-width:1280px;margin:0 auto;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="sk-box" style="width:28px;height:28px;border-radius:6px;background:rgba(229,72,77,0.15);"></div>
            <div class="sk-box" style="width:110px;height:18px;"></div>
          </div>
          <div style="display:flex;gap:20px;">
            <div class="sk-box" style="width:50px;height:14px;"></div>
            <div class="sk-box" style="width:80px;height:14px;"></div>
            <div class="sk-box" style="width:70px;height:14px;"></div>
          </div>
          <div class="sk-box" style="width:120px;height:36px;border-radius:6px;border:1px solid #2A2D33;"></div>
        </div>

        <!-- Skeleton Hero Section -->
        <div class="sk-hero-grid" style="max-width:1280px;margin:0 auto;padding:70px 24px 50px;display:grid;grid-template-columns:1.2fr 0.8fr;gap:48px;align-items:center;">
          <div style="display:flex;flex-direction:column;gap:16px;">
            <div class="sk-box" style="width:240px;height:24px;border-radius:4px;background:rgba(229,72,77,0.12);"></div>
            <div class="sk-box" style="width:85%;height:46px;border-radius:8px;"></div>
            <div class="sk-box" style="width:65%;height:46px;border-radius:8px;"></div>
            <div class="sk-box" style="width:95%;height:14px;margin-top:10px;"></div>
            <div class="sk-box" style="width:80%;height:14px;"></div>
            <div style="display:flex;gap:14px;margin-top:16px;">
              <div class="sk-box" style="width:140px;height:42px;border-radius:6px;background:rgba(229,72,77,0.25);"></div>
              <div class="sk-box" style="width:130px;height:42px;border-radius:6px;border:1px solid #2A2D33;"></div>
            </div>
          </div>
          <div class="sk-box" style="height:360px;border-radius:12px;border:1px solid #2A2D33;"></div>
        </div>

        <!-- Skeleton Cards Grid -->
        <div style="max-width:1280px;margin:0 auto;padding:30px 24px 80px;">
          <div class="sk-box" style="width:280px;height:32px;margin-bottom:24px;border-radius:6px;"></div>
          <div class="sk-cards-grid" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;">
            <div class="sk-box" style="height:240px;border-radius:8px;border:1px solid #2A2D33;"></div>
            <div class="sk-box" style="height:240px;border-radius:8px;border:1px solid #2A2D33;"></div>
            <div class="sk-box" style="height:240px;border-radius:8px;border:1px solid #2A2D33;"></div>
            <div class="sk-box" style="height:240px;border-radius:8px;border:1px solid #2A2D33;"></div>
            <div class="sk-box" style="height:240px;border-radius:8px;border:1px solid #2A2D33;"></div>
            <div class="sk-box" style="height:240px;border-radius:8px;border:1px solid #2A2D33;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
